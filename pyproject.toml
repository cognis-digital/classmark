[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-classmark"
version = "0.1.1"
description = "CAPCO-shape classification banner + portion marking library — placeholders only"
license = { text = "LicenseRef-COCL-1.0" }
requires-python = ">=3.10"
authors = [{name="Cognis Digital", email="suite@cognis.digital"}]
readme = "README.md"
keywords = ["military","ic","dod","cognis-digital","classmark"]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
"classmark-emit" = "classmark.connect:emit_main"
classmark = "classmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["classmark", "cognis_mil"]

[tool.hatch.metadata]
allow-direct-references = true
